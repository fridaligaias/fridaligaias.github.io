<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Fridalí Gaias</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main class="content" style="margin-left: 0; max-width: 100%; min-height: 100vh; display: flex; flex-direction: column;">
        <div class="top-bar" style="max-width: 800px; margin: 0 auto; width: 100%; padding: 2rem 0;">
            <a href="index.html" class="btn btn-secondary"><i class="fa-solid fa-arrow-left"></i> Back</a>
            <button class="theme-toggle"><i class="fa-solid fa-moon"></i></button>
        </div>

        <div class="contact-container" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 2rem;">
            <h1 style="margin-bottom: 0.5rem;">Get in Touch</h1>
            <p class="empty-state" style="margin-bottom: 2rem;">Have a question or want to collaborate?</p>
            
            <form action="https://formspree.io/f/YOUR_UNIQUE_ID" method="POST" class="card" style="width: 100%; max-width: 500px; display: flex; flex-direction: column; gap: 1.2rem;">
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--accent-purple);">Name</label>
                    <input type="text" name="name" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: var(--text-heading);">
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--accent-purple);">Email</label>
                    <input type="email" name="_replyto" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: var(--text-heading);">
                </div>
                <div class="form-group">
                    <label style="display: block; margin-bottom: 0.5rem; font-size: 0.9rem; color: var(--accent-purple);">Message</label>
                    <textarea name="message" rows="5" required style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--glass-border); background: rgba(255,255,255,0.05); color: var(--text-heading); resize: none;"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 14px;">Send Message</button>
            </form>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
